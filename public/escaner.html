<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo de Marcación Diaria (Escáner) - I.E. Santa Rosa</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Librería Oficial HTML5 QR Code -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 sm:p-6">

  <div class="max-w-2xl mx-auto space-y-5">
    <!-- Encabezado Principal -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="bg-red-50 text-red-600 p-2.5 rounded-xl font-bold text-sm border border-red-100">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <div>
          <h1 class="text-base font-black tracking-tight text-slate-900">I.E. SANTA ROSA</h1>
          <p class="text-[11px] font-bold text-slate-500 uppercase tracking-wide">MÓDULO DE MARCACIÓN DIARIA (ESCÁNER)</p>
        </div>
      </div>
      <button onclick="window.location.href='index.html'" class="bg-red-600 hover:bg-red-700 text-white font-bold text-xs px-4 py-2 rounded-xl transition-all shadow-sm cursor-pointer">
        Salir
      </button>
    </div>

    <!-- Controles de Cámara y Escáner -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
      <div class="flex justify-between items-center">
        <div class="flex items-center gap-2">
          <span class="text-xs font-black uppercase text-slate-400">Escáner de Fotochecks</span>
          <span id="camara-status" class="text-xs font-normal text-slate-400">INACTIVA</span>
        </div>
        <div id="estado-registro-badge" class="inline-flex items-center gap-1.5 text-[11px] font-extrabold px-2.5 py-0.5 rounded-md bg-amber-100 text-amber-700 border border-amber-200">
          <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> CERRADO
        </div>
      </div>

      <!-- Visor de Cámara -->
      <div id="reader" class="w-full bg-slate-900 border border-slate-300 rounded-xl overflow-hidden min-h-[280px] flex items-center justify-center relative shadow-inner">
        <div class="text-center p-6 text-slate-400">
          <i class="fa-solid fa-video-slash text-3xl mb-2 block"></i>Cámara apagada. Pulse encender.
        </div>
      </div>

      <!-- Botón de Control de Cámara -->
      <div class="grid grid-cols-1 gap-3 pt-1">
        <button id="btn-toggle-camara" type="button" onclick="toggleCamara()" class="bg-rose-600 hover:bg-rose-700 text-white font-bold text-xs py-2.5 px-4 rounded-xl transition-all shadow-sm flex items-center justify-center gap-2 cursor-pointer">
          <i class="fa-solid fa-power-off"></i> Encender Cámara
        </button>
      </div>
    </div>

    <!-- Última Marcación Card -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
      <h2 class="text-xs font-black uppercase text-slate-400 flex items-center gap-1.5">
        <i class="fa-solid fa-id-badge text-indigo-600"></i> Última Marcación
      </h2>
      <div id="resultado-card" class="bg-slate-50/80 rounded-2xl p-5 border border-slate-200 flex flex-col items-center justify-center text-center space-y-2.5 min-h-[160px]">
        <div class="w-14 h-14 rounded-full bg-emerald-600 text-white flex items-center justify-center font-black text-2xl shadow-md">
          U
        </div>
        <div>
          <h3 class="text-base font-extrabold text-slate-900">Usuario Identificado</h3>
          <p class="text-xs font-mono font-bold text-slate-500 mt-0.5">Esperando escaneo...</p>
        </div>
        <div class="pt-1">
          <span class="inline-flex items-center gap-1.5 px-3 py-1 text-xs font-black rounded-lg bg-slate-100 text-slate-600 border border-slate-200 shadow-sm">
            <i class="fa-solid fa-clock text-[10px]"></i> --:--:--
          </span>
        </div>
      </div>
    </div>

    <!-- Marcaciones del Día Table -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-xs font-black uppercase text-slate-400 flex items-center gap-1.5">
          <i class="fa-solid fa-list-check text-indigo-600"></i> Marcaciones del Día
        </h2>
        <button onclick="actualizarTablaMarcacionesHoy()" class="text-xs font-bold text-indigo-600 hover:text-indigo-800 transition-colors flex items-center gap-1 cursor-pointer">
          <i class="fa-solid fa-rotate"></i> Actualizar
        </button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-slate-200 text-[11px] font-extrabold text-slate-400 uppercase bg-slate-50">
              <th class="py-2.5 px-3">Código</th>
              <th class="py-2.5 px-3">Nombre</th>
              <th class="py-2.5 px-3">Aula</th>
              <th class="py-2.5 px-3">Entrada</th>
              <th class="py-2.5 px-3">Salida</th>
              <th class="py-2.5 px-3">Estado</th>
            </tr>
          </thead>
          <tbody id="tabla-asistencias-hoy" class="text-xs divide-y divide-slate-100 font-medium">
            <tr>
              <td colspan="6" class="text-center py-6 text-slate-400">Sin marcaciones registradas hoy.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Notificación flotante -->
  <div id="notificacion-alerta" class="hidden fixed bottom-4 right-4 z-50 p-3 rounded-xl shadow-lg border text-xs font-bold max-w-sm"></div>

  <!-- Script Lógico del Escáner -->
  <script src="js/escaner.js"></script>
</body>
</html>
