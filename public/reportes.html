<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control y Reportes - I.E. Santa Rosa</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
  <div class="dashboard-container">
    <aside class="sidebar">
      <div class="brand">🏫 I.E. Santa Rosa</div>
      <nav class="menu">
        <a href="dashboard.html">🏠 Inicio</a>
        <a href="reportes.html" class="active">📁 Control y Reportes</a>
        <a href="rankings.html">🏆 Rankings y Puntos</a>
        <a href="inscripciones.html">📝 Inscribir / CRUD</a>
      </nav>
    </aside>

    <main class="main-content">
      <div class="card-box">
        <div class="card-title">📂 CONTROL Y REPORTES</div>
        
        <div style="display: flex; gap: 15px; align-items: center; margin-bottom: 20px; flex-wrap: wrap;">
          <div style="display:flex; align-items:center; gap:8px;">
            <select id="filtroTipo" class="form-control" style="width: 170px;">
              <option value="Diario">Reporte Diario</option>
              <option value="Semanal">Reporte Semanal</option>
              <option value="Mensual">Reporte Mensual</option>
            </select>
          </div>

          <div id="contenedorFecha">
            <input type="date" id="filtroFecha" class="form-control" style="width: 170px;">
          </div>

          <div style="margin-left: auto; display:flex; gap:10px;">
            <button id="btnReporteDocentes" class="btn-submit" style="background:#0f172a;">📄 Docentes PDF</button>
            <button id="btnReporteGrado" class="btn-submit" style="background:#0284c7;">📊 Grado PDF</button>
            <button id="btnFichaAlumno" class="btn-submit" style="background:#16a34a;">📄 Ficha Alumno PDF</button>
          </div>
        </div>

        <!-- Filtro por Aula y Buscador -->
        <div style="display:flex; gap:15px; margin-bottom:12px; background:#f8fafc; padding:12px; border-radius:8px; flex-wrap:wrap; align-items:center;">
          <div style="display:flex; align-items:center; gap:8px;">
            <label style="font-size:13px; font-weight:bold; color:#475569;">Filtro por Aula:</label>
            <select id="filtroNivel" class="form-control" style="width:130px;">
              <option value="Todos">Todos</option>
              <option value="Secundaria">Secundaria</option>
              <option value="Primaria">Primaria</option>
            </select>
            <select id="filtroGrado" class="form-control" style="width:90px;">
              <option value="Todos">Todos</option>
              <option value="1ro">1ro</option>
              <option value="2do">2do</option>
              <option value="3ro">3ro</option>
              <option value="4to">4to</option>
              <option value="5to">5to</option>
              <option value="6to">6to</option>
            </select>
            <select id="filtroSeccion" class="form-control" style="width:70px;">
              <option value="Todos">Todos</option>
              <option value="A">A</option>
              <option value="B">B</option>
              <option value="C">C</option>
              <option value="D">D</option>
            </select>
          </div>

          <div style="flex-grow:1; display:flex; align-items:center;">
            <input type="text" id="filtroBusqueda" class="form-control" placeholder="🔍 Buscar por nombre o código...">
          </div>
        </div>

        <!-- Menú Desplegable: Filtrar Alumno -->
        <div style="display:flex; gap:10px; margin-bottom:20px; background:#f1f5f9; padding:10px 12px; border-radius:8px; align-items:center;">
          <label style="font-size:13px; font-weight:bold; color:#334155; min-width:110px;">Filtrar Alumno:</label>
          <select id="selectAlumnoIndividual" class="form-control" style="flex-grow:1;">
            <option value="todos">-- Seleccionar Alumno --</option>
          </select>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>CÓDIGO</th>
                <th>NOMBRE</th>
                <th>AULA / ASIGNACIÓN</th>
                <th style="color: #16a34a;">ASIST.</th>
                <th style="color: #ca8a04;">TARD.</th>
                <th style="color: #dc2626;">FALTAS</th>
                <th>PUNTAJE</th>
                <th style="text-align: center;">ACCIONES</th>
              </tr>
            </thead>
            <tbody id="tbodyReportes"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal para Editar Asistencia Directiva -->
  <div id="modal-editar-asistencia" style="display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(4px); align-items: center; justify-content: center; padding: 16px; z-index: 9999;">
    <div style="background: white; width: 100%; max-width: 420px; border-radius: 16px; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="font-size: 16px; font-weight: 800; color: #0f172a;">✏️ Editar Asistencia del Alumno</h3>
        <button onclick="cerrarModalEditar()" style="background: none; border: none; color: #94a3b8; font-size: 20px; font-weight: bold; cursor: pointer;">✕</button>
      </div>
      
      <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; margin-bottom: 16px; font-size: 12px; display: flex; flex-direction: column; gap: 6px;">
        <p><strong style="color: #64748b;">Alumno:</strong> <span id="edit-nombre-alumno" style="font-weight: 700; color: #0f172a;">-</span></p>
        <p><strong style="color: #64748b;">Código:</strong> <span id="edit-codigo-alumno" style="font-family: monospace; color: #334155;">-</span></p>
      </div>

      <form id="form-editar-asistencia" onsubmit="guardarEdicionAsistencia(event)" style="display: flex; flex-direction: column; gap: 16px;">
        <input type="hidden" id="edit-codigo-input">
        
        <div class="form-group">
          <label style="font-size: 13px; font-weight: bold; color: #475569; margin-bottom: 6px; display: block;">Nuevo Estado de Asistencia:</label>
          <select id="edit-estado-select" class="form-control" style="font-weight: 700;">
            <option value="PUNTUAL">🟢 PUNTUAL (Asistencia normal)</option>
            <option value="TARDE">🟡 TARDANZA (Llegó a destiempo)</option>
            <option value="FALTA">🔴 FALTA (Inasistencia registrada)</option>
          </select>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 10px;">
          <button type="button" onclick="cerrarModalEditar()" class="btn-submit" style="background: #94a3b8; width: 50%; float: none;">Cancelar</button>
          <button type="submit" class="btn-submit" style="background: #0284c7; width: 50%; float: none;">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/reportes.js"></script>
</body>
</html>
