<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I.E. Santa Rosa - Iniciar Sesión</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
    <div class="text-center mb-6">
      <div class="flex items-center gap-2 mb-6 pb-2 border-b border-slate-800">
       <img src="img/logo.png" alt="Logo I.E. Santa Rosa" class="w-16 h-16 object-contain">
        <h2 class="text-white font-bold text-base">I.E. SANTA ROSA</h2>
      </div>
      <p class="text-xs text-slate-500">Sistema Oficial de Control Asistencial</p>
    </div>
    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">CÓDIGO DE USUARIO</label>
        <input type="text" id="login-codigo" placeholder="Ej: DIR-SRN-001 o DOC-SRN-101" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm" required>
      </div>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg text-sm">Ingresar al Sistema</button>
    </form>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const codigo = document.getElementById('login-codigo').value;
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ codigo })
      });
      const data = await res.json();
      if(data.success) {
        localStorage.setItem('user_session', JSON.stringify(data.user));
        if(data.user.rol === 'Director') {
          window.location.href = 'dashboard.html';
        } else {
          window.location.href = 'escaner.html';
        }
      } else {
        alert(data.message);
      }
    });
  </script>
</body>
</html>
